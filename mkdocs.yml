# 이 사이트는 "강의 포털" 입니다. 개별 강의는 docs/courses/<slug>/ 아래에 하나씩
# 독립된 트리로 들어가고, docs/index.md 가 그 목록(카탈로그)을 보여 줍니다.
# 새 강의 추가 절차는 저장소 루트의 ADDING_A_COURSE.md 를 참고하세요.
site_name: JY Lab 강의 Archive
site_description: AI · 데이터 · SQL 실습 중심 강의 자료 모음
site_author: Jaeyoo
# User Pages 저장소(<username>.github.io)는 서브경로 없이 루트로 게시됩니다.
site_url: https://siapapa.github.io/

# 우상단 GitHub 아이콘 링크는 학생들이 강사용 노트북(notebooks/)에 직접 접근하지
# 못하도록 의도적으로 비활성화. 다시 노출하려면 repo_name / repo_url 을 복원하면 됨.

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    logo: material/robot-happy-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: en
  # 강의를 courses/<slug>/ 하위로 옮기면서 깨진 예전 URL(/day1/, /setup/ 등)을
  # 새 경로로 자동 전환. 수강생 북마크·공유 링크가 계속 살아 있도록 유지합니다.
  # 강의가 더 추가돼도 이 블록은 "AI SQL 에이전트" 1기 전용 — 건드릴 필요 없음.
  - redirects:
      redirect_maps:
        setup.md: courses/ai-sql-agent/setup.md
        beginners-guide.md: courses/ai-sql-agent/beginners-guide.md
        day1/index.md: courses/ai-sql-agent/day1/index.md
        day1/01-ot-demo.md: courses/ai-sql-agent/day1/01-ot-demo.md
        day1/02-postgres-basics.md: courses/ai-sql-agent/day1/02-postgres-basics.md
        day1/03-sql-advanced.md: courses/ai-sql-agent/day1/03-sql-advanced.md
        day1/04-schema-intelligence.md: courses/ai-sql-agent/day1/04-schema-intelligence.md
        day1/05-llamaindex-intro.md: courses/ai-sql-agent/day1/05-llamaindex-intro.md
        day1/06-embedding-chromadb.md: courses/ai-sql-agent/day1/06-embedding-chromadb.md
        day1/07-text-to-sql.md: courses/ai-sql-agent/day1/07-text-to-sql.md
        day1/08-project-briefing.md: courses/ai-sql-agent/day1/08-project-briefing.md
        day2/index.md: courses/ai-sql-agent/day2/index.md
        day2/09-peer-review.md: courses/ai-sql-agent/day2/09-peer-review.md
        day2/10-text-to-sql-advanced.md: courses/ai-sql-agent/day2/10-text-to-sql-advanced.md
        day2/11-multiturn-chatbot.md: courses/ai-sql-agent/day2/11-multiturn-chatbot.md
        day2/12-gradio-ui.md: courses/ai-sql-agent/day2/12-gradio-ui.md
        day3/index.md: courses/ai-sql-agent/day3/index.md
        day3/13-vanna-intro.md: courses/ai-sql-agent/day3/13-vanna-intro.md
        day3/14-vanna-training.md: courses/ai-sql-agent/day3/14-vanna-training.md
        day3/15-langchain-lcel.md: courses/ai-sql-agent/day3/15-langchain-lcel.md
        day3/16-lcel-rag-chain.md: courses/ai-sql-agent/day3/16-lcel-rag-chain.md
        day3/17-advanced-rag-query.md: courses/ai-sql-agent/day3/17-advanced-rag-query.md
        day3/18-advanced-rag-retrieval.md: courses/ai-sql-agent/day3/18-advanced-rag-retrieval.md
        day3/19-langgraph-concept.md: courses/ai-sql-agent/day3/19-langgraph-concept.md
        day3/20-sql-agent-build.md: courses/ai-sql-agent/day3/20-sql-agent-build.md
        day4/index.md: courses/ai-sql-agent/day4/index.md
        day4/21-langsmith.md: courses/ai-sql-agent/day4/21-langsmith.md
        day4/22-ragas-eval.md: courses/ai-sql-agent/day4/22-ragas-eval.md
        day4/23-final-tuning.md: courses/ai-sql-agent/day4/23-final-tuning.md
        day4/24-final-presentation.md: courses/ai-sql-agent/day4/24-final-presentation.md
        appendix/glossary.md: courses/ai-sql-agent/appendix/glossary.md
        appendix/notebook-numbering.md: courses/ai-sql-agent/appendix/notebook-numbering.md
        appendix/troubleshooting.md: courses/ai-sql-agent/appendix/troubleshooting.md
        appendix/project-brief.md: courses/ai-sql-agent/appendix/project-brief.md
        appendix/free-llm-ollama.md: courses/ai-sql-agent/appendix/free-llm-ollama.md
  # with-pdf 는 CI(requirements-docs.txt)에 미설치 + --strict 모드에서 "PDF disabled"
  # 경고가 fatal 로 처리돼 GitHub Pages 배포가 막혀 일시 비활성화.
  # PDF 가 필요하면: (1) `pip install mkdocs-with-pdf` 후 (2) 아래 블록 주석 해제,
  # (3) `ENABLE_PDF_EXPORT=1 mkdocs build` 로 로컬 생성.
  # - with-pdf:
  #     output_path: pdf/AI_SQL_Agent_24H.pdf
  #     cover_title: AI 기반 SQL 분석 에이전트 구축
  #     cover_subtitle: 24시간 집중 강의 (Day 1 ~ Day 4)
  #     author: Jaeyoo
  #     toc_title: 목차
  #     heading_shift: false
  #     enabled_if_env: ENABLE_PDF_EXPORT

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/colab-links.js      # Colab 기반 과정용
  - javascripts/lab-links.js        # 로컬 실행 과정용 (Omniverse 계열)

